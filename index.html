<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />

		<!-- SEO. The page title and meta description are injected at build time
		     by vite-react-ssg's Head component (see src/App.jsx), so there is
		     exactly one of each in the output. Do not re-add them here. -->
		<link rel="canonical" href="https://whatarush.org/" />
		<meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />
		<meta name="theme-color" content="#0d9488" />

		<!-- Geo Tags -->
		<meta name="geo.region" content="SV-LI" />
		<meta name="geo.placename" content="La Libertad, El Salvador" />
		<meta name="geo.position" content="13.4353125;-89.1872656" />
		<meta name="ICBM" content="13.4353125, -89.1872656" />

		<!-- Open Graph -->
		<meta property="og:type" content="website" />
		<meta property="og:url" content="https://whatarush.org/" />
		<meta property="og:title" content="What A Rush - Beachfront Horseback Riding & The Cowboy Casita | El Salvador" />
		<meta property="og:description" content="Beachfront horseback riding, guided trail rides through sugar cane fields and estuaries, horse therapy, and the beachfront Cowboy Casita rental in La Libertad, El Salvador." />
		<meta property="og:image" content="https://whatarush.org/images/hero-background.jpg" />
		<meta property="og:image:width" content="1200" />
		<meta property="og:image:height" content="630" />
		<meta property="og:image:alt" content="Horseback riding on the beach at What A Rush, La Libertad, El Salvador" />
		<meta property="og:locale" content="en_US" />
		<meta property="og:site_name" content="What A Rush Riding Stables" />

		<!-- Twitter Card -->
		<meta name="twitter:card" content="summary_large_image" />
		<meta name="twitter:title" content="What A Rush - Beachfront Horseback Riding | El Salvador" />
		<meta name="twitter:description" content="Guided trail rides, horse therapy, riding lessons, and The Cowboy Casita beachfront rental in La Libertad, El Salvador." />
		<meta name="twitter:image" content="https://whatarush.org/images/hero-background.jpg" />
		<meta name="twitter:image:alt" content="Horseback riding on the beach at What A Rush, La Libertad, El Salvador" />

		<!-- AI Discoverability -->
		<link rel="alternate" type="text/plain" href="https://whatarush.org/llms.txt" title="LLM-friendly site summary" />

		<!-- Favicon -->
		<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
		<link rel="apple-touch-icon" href="/favicon.svg" />

		<!-- Preload critical assets (LCP). WebP only: rel=preload does no content
		     negotiation, so an untyped jpg preload would download on every browser
		     even though modern browsers use the webp via <picture>. -->
		<link rel="preload" as="image" href="/images/hero-background.webp" type="image/webp" fetchpriority="high" />

		<!-- Preconnect to third-party origins -->
		<link rel="preconnect" href="https://www.google.com" crossorigin />
		<link rel="preconnect" href="https://maps.googleapis.com" crossorigin />
	</head>
	<body>
		<div id="root"></div>
		<script type="module" src="/src/main.jsx"></script>
	</body>
</html>
